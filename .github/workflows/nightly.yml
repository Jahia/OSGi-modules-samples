name: Nightly Test run

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  integration-tests-sn:
    name: Integration Tests (Jahia-SN)
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    with:
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      module_id: OSGi-modules-samples
      incident_service: OSGi-modules-samples-JahiaSN
      provisioning_manifest: provisioning-manifest-snapshot.yml
      artifact_prefix: osgi-sample-jahia-sn
      module_branch: ${{ github.ref }}

  integration-tests-rl:
    name: Integration Tests (Jahia-RL)
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    with:
      jahia_image: jahia/jahia-ee:8
      module_id: OSGi-modules-samples
      incident_service: OSGi-modules-samples-JahiaRL
      provisioning_manifest: provisioning-manifest-snapshot.yml
      artifact_prefix: osgi-sample-jahia-rl
      module_branch: ${{ github.ref }}
